<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODEC CodeTracker</title>
<style>
:root{--bg:#0a0e17;--glass:rgba(22,30,46,.6);--drawer:rgba(12,17,28,.95);--gb:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--tx:#e8ecf3;--mut:#8f9bb0;--ac:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--b1:rgba(56,189,248,.2);--b2:rgba(167,139,250,.18);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--glass:rgba(255,255,255,.72);--drawer:rgba(255,255,255,.97);--gb:rgba(15,23,42,.09);--line:rgba(15,23,42,.08);--tx:#0f172a;--mut:#64748b;--ac:#0284c7;--ok:#059669;--warn:#b45309;--bad:#dc2626;--b1:rgba(56,189,248,.25);--b2:rgba(167,139,250,.2);color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(600px 400px at 8% 0%,var(--b1),transparent 65%),radial-gradient(520px 400px at 92% 15%,var(--b2),transparent 65%);background-attachment:fixed;color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0}h1 span{color:var(--ac)}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:0 0 12px}
.sub{color:var(--mut);font-size:12.5px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{background:var(--glass);color:var(--tx);border:1px solid var(--gb);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
button{cursor:pointer}
button.p{background:linear-gradient(135deg,#38bdf8,#818cf8);border-color:transparent;color:#04121c;font-weight:600}
input{width:100%}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--glass);border:1px solid var(--gb);border-radius:12px;max-width:100%;overflow-x:auto;margin-bottom:20px}
.seg button{border:0;background:transparent;color:var(--mut);padding:7px 14px;white-space:nowrap}
.seg button.on{background:rgba(56,189,248,.16);color:var(--ac);font-weight:600}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.stat b{display:block;font-size:28px;line-height:1.2}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 8px;margin:0 -8px;border-radius:10px;cursor:pointer}
.li:hover,tr.r:hover{background:rgba(56,189,248,.1)}
.li+.li{border-top:1px solid var(--line)}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;cursor:pointer}
tr.r{cursor:pointer}
.mb{display:flex;height:5px;width:110px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px}.mb i{display:block}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--gb)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.chip{background:var(--glass);border:1px solid var(--gb);border-radius:12px;padding:8px 10px}.chip b{display:block;font-size:19px}
.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.cal div{aspect-ratio:1;border-radius:3px}.cal div:hover{outline:1px solid var(--tx)}
.ml{display:grid;gap:3px;font-size:9px;color:var(--mut);white-space:nowrap;margin-bottom:3px}
.pb{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;margin:8px 0}.pb div{background:var(--line);border-radius:4px}.pb i{display:block;height:8px;border-radius:4px}
.sg{display:grid;grid-template-columns:1fr auto 14px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.sg .dot{margin:0}
.blk{margin-bottom:22px}
#form{display:none;margin-bottom:16px}#form.show{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30}#scrim.open{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);transform:translateX(100%);transition:transform .25s;background:var(--drawer);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-left:1px solid var(--gb);z-index:40;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.dh b{font-size:18px}
svg text{fill:var(--mut);font-size:9px}svg .big{fill:var(--tx);font-size:15px;font-weight:600}
[data-tip]{cursor:pointer}rect[data-tip]:hover,circle[data-tip]:hover{opacity:.75}
#tip{position:fixed;z-index:60;pointer-events:none;display:none;background:var(--drawer);border:1px solid var(--gb);color:var(--tx);padding:6px 10px;border-radius:8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:240px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>CODEC <span>CodeTracker</span></h1><div class="sub">Mentor dashboard · demo data</div></div>
  <div class="ctl"><select id="mentor"></select><button class="p" id="addBtn">+ Add mentee</button></div>
</header>
<div class="card" id="form">
  <div class="fg"><input id="fn" placeholder="Name"><input id="fl" placeholder="LeetCode"><input id="fc" placeholder="Codeforces"><input id="fk" placeholder="CodeChef"><input id="fh" placeholder="HackerRank"></div>
  <button class="p" id="save">Save mentee</button> <span class="sub">Demo only. Real stats come from the backend.</span>
</div>
<nav class="seg" id="seg"><button data-v="ov">Overview</button><button data-v="lb">Leaderboard</button><button data-v="at">Needs attention</button><button data-v="ig">Integrity check</button></nav>
<main id="main"></main>
</div>
<div id="scrim"></div>
<aside id="drawer"><div class="dh"><div id="dt"></div><button id="dx" aria-label="Close">✕</button></div><div class="seg" id="dtabs"></div><div id="db"></div></aside>
<div id="tip"></div>

<script>
const mentors=["All mentors","Aarav","Meera","Rohan"];
const names=["Ananya Patil","Vivek Kulkarni","Sneha Joshi","Omkar Deshmukh","Isha Shinde","Rahul More","Pooja Jadhav","Kunal Pawar","Tanvi Kale","Siddharth Rao","Nidhi Gaikwad","Harsh Bhosale"];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
let data=names.map((n,i)=>{const lc=Math.floor(rnd()*220),cf=Math.floor(rnd()*60),cc=Math.floor(rnd()*80),hr=Math.floor(rnd()*50);
 return{name:n,mentor:mentors[1+i%3],lc,cf,cc,hr,total:lc+cf+cc+hr,rating:800+Math.floor(rnd()*700),week:Math.floor(rnd()*25),last:Math.floor(rnd()*12),series:Array.from({length:8},()=>Math.floor(rnd()*25))}});
const $=id=>document.getElementById(id);
const COL=["#38bdf8","#a78bfa","#fbbf24","#34d399"],PL=["LeetCode","Codeforces","CodeChef","HackerRank"];
let view="ov",sortK="total",dir=-1,q="",cur=null,dtab="sum";
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("mentor").innerHTML=mentors.map(m=>`<option>${m}</option>`).join("");
const scope=()=>data.filter(d=>$("mentor").value==="All mentors"||d.mentor===$("mentor").value);
const att=d=>d.last>=5||d.week<3,pc=d=>d.last<=3?"ok":d.last<=6?"warn":"bad",lt=d=>d.last===0?"today":d.last+"d ago";

function prng(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return()=>(h=(h*1664525+1013904223)>>>0)/4294967296}
function donut(v){const s=v.reduce((a,b)=>a+b,0),t=s||1,r=36,c=2*Math.PI*r;let o=0;return `<svg viewBox="0 0 100 100" width="120" height="120"><g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/>`+v.map((x,i)=>{const l=x/t*c,e=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${COL[i]}" stroke-width="14" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}" data-tip="${PL[i]}: ${x} solved (${Math.round(x/t*100)}%)"/>`;o+=l;return e}).join("")+`</g><text class="big" x="50" y="55" text-anchor="middle">${s}</text></svg>`}
function legend(v){return PL.map((p,i)=>`<div class="sub"><span class="dot" style="background:${COL[i]}"></span>${p}: ${v[i]}</div>`).join("")}
function bars(v){const mx=Math.max(...v,1);return `<svg viewBox="0 0 320 110" width="100%" style="max-width:440px">`+v.map((x,i)=>{const h=x/mx*70,X=i*40+8;return `<rect data-tip="${x} solved · ${i===v.length-1?'this week':(v.length-1-i)+' wk ago'}" x="${X}" y="${88-h}" width="26" height="${h}" rx="4" fill="var(--ac)"/><text x="${X+13}" y="${84-h}" text-anchor="middle">${x}</text><text x="${X+13}" y="102" text-anchor="middle">${i===v.length-1?'Now':'W'+(i+1)}</text>`}).join("")+`</svg>`}

function an(d){const R=prng(d.name+'x'),s=R()<0.35,r=(a,b)=>a+Math.floor(R()*(b-a+1));
const m=s?{b:r(6,13),t:r(3,9),h:r(2,7),f:r(90,99),j:r(450,900),c:r(12,40)}:{b:r(1,5),t:r(14,45),h:r(0,1),f:r(45,85),j:r(0,350),c:r(50,90)};
const rules=[['Peak solves in one hour',m.b,m.b>=8?20:m.b>=5?8:0,'Typical: 1–4'],['Median time on a medium problem',m.t+' min',m.t<8?25:m.t<12?12:0,'Typical: 15–40 min'],['Hard problems solved in under 10 min',m.h,m.h>=3?25:m.h>=1?8:0,'Typical: 0'],['Accepted on first attempt',m.f+'%',m.f>=92?15:0,'Typical: 45–85%'],['Hardest solve above current rating',m.j+' pts',m.j>=500?15:0,'Typical: under 350'],['Contest solve rate vs practice',m.c+'%',m.c<35?25:m.c<50?10:0,'Typical: 50–90%']];
const score=Math.min(100,rules.reduce((a,x)=>a+x[2],0));
return{rules,score,lvl:score>=60?'High':score>=30?'Medium':'Low'}}
const lc=l=>l==='High'?'bad':l==='Medium'?'warn':'ok';
function sig(d){const x=an(d);return `<div class="sub" style="margin-bottom:6px">Flag level: <b class="${lc(x.lvl)}">${x.lvl} (${x.score}/100)</b> · indicators for mentor review, not proof</div>`+x.rules.map(([k,v,p,n])=>`<div class="sg"><span>${k}<div class="sub">${n}</div></span><b>${v}</b><span class="dot" style="background:${p>=15?'var(--bad)':p>0?'var(--warn)':'var(--ok)'}"></span></div>`).join('')}

function prof(d){const R=prng(d.name),N=182,today=new Date();today.setHours(0,0,0,0);
const act=[];for(let i=0;i<N;i++){const ago=N-1-i,on=R()<0.5,v=Math.floor(R()*6)+1;act.push(ago<d.last||!on?0:v)}
let cu=0;for(let i=N-1;i>=0&&act[i]>0;i--)cu++;
let best=0,run=0;act.forEach(v=>{run=v?run+1:0;best=Math.max(best,run)});
const days=act.filter(v=>v).length,start=new Date(today);start.setDate(today.getDate()-(N-1));const pad=start.getDay(),cols=Math.ceil((N+pad)/7);
let cells='<div></div>'.repeat(pad),lab='',pm=-1;
act.forEach((v,i)=>{const dt=new Date(start);dt.setDate(start.getDate()+i);cells+=`<div data-tip="${v?v+' submission'+(v>1?'s':''):'No submissions'} on ${dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}" style="background:${v?`rgba(56,189,248,${0.2+Math.min(v,5)*0.16})`:'var(--line)'}"></div>`});
for(let c=0;c<cols;c++){const dt=new Date(start);dt.setDate(start.getDate()+Math.max(c*7-pad,0));const m=dt.getMonth();lab+=`<span>${m!==pm?dt.toLocaleString('en',{month:'short'}):''}</span>`;pm=m}
let r=d.rating||800;const rt=[r];for(let i=0;i<7;i++){r=Math.max(600,r+Math.round((R()-0.45)*120));rt.unshift(r)}
const mn=Math.min(...rt),mx=Math.max(...rt),pts=rt.map((v,i)=>[i*40+20,75-(v-mn)/(mx-mn||1)*55,v]);
const line=d.cf?`<svg viewBox="0 0 300 100" width="100%" style="max-width:440px"><polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#a78bfa" stroke-width="2"/>${pts.map((p,i)=>`<circle data-tip="Contest ${i+1}: rating ${p[2]}" cx="${p[0]}" cy="${p[1]}" r="5" fill="#a78bfa"/><text x="${p[0]}" y="96" text-anchor="middle">C${i+1}</text>`).join('')}</svg>`:`<div class="sub">No Codeforces contests yet.</div>`;
const e=Math.round(d.lc*.5),m2=Math.round(d.lc*.38),dv=[e,m2,d.lc-e-m2],dc=['#34d399','#fbbf24','#f87171'],dn=['Easy','Medium','Hard'];
const diff=`<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:4px 0 10px">${dv.map((v,i)=>`<div style="width:${v/(d.lc||1)*100}%;background:${dc[i]}"></div>`).join('')}</div><div style="display:flex;gap:14px;flex-wrap:wrap">${dv.map((v,i)=>`<span class="sub"><span class="dot" style="background:${dc[i]}"></span>${dn[i]} ${v}</span>`).join('')}</div>`;
const topics=['Arrays','Strings','DP','Graphs','Trees','Math'].map(t=>[t,20+Math.floor(R()*75)]).map(([t,p])=>`<div class="pb"><span>${t}</span><div><i style="width:${p}%;background:${COL[3]}"></i></div><span>${p}%</span></div>`).join('');
const pv=[d.lc,d.cf,d.cc,d.hr];
return{sum:`<div class="chips">${[['Total',d.total],['This week',d.week],['Streak',cu+'d'],['Best',best+'d']].map(([k,v])=>`<div class="chip"><b>${v}</b><span class="sub">${k}</span></div>`).join('')}</div>
<div class="blk"><h3>Activity · ${days} active days in 26 weeks</h3><div style="overflow-x:auto"><div style="min-width:430px"><div class="ml" style="grid-template-columns:repeat(${cols},1fr)">${lab}</div><div class="cal" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div></div></div></div>
<div class="blk"><h3>Solved per week</h3>${bars(d.series)}</div>`,
plat:`<div class="blk"><h3>Platform split</h3><div class="dn">${donut(pv)}<div>${legend(pv)}</div></div></div><div class="blk"><h3>Codeforces rating</h3>${line}</div><div class="blk"><h3>LeetCode difficulty</h3>${diff}</div><div class="blk"><h3>Topic strength</h3>${topics}</div><div class="sub">Charts use demo data until the backend is connected.</div>`}}

const row=d=>`<div class="li" data-n="${esc(d.name)}"><div><b>${esc(d.name)}</b><div class="sub">${d.mentor}</div></div><div style="text-align:right"><b>${d.week}</b> <span class="sub">this week</span><div><span class="pill ${pc(d)}">${lt(d)}</span></div></div></div>`;
function mp(){const sel=$('mentor').value;
const rows=mentors.slice(1).map(m=>{const l=data.filter(d=>d.mentor===m),n=l.length||1;return{m,n:l.length,avg:Math.round(l.reduce((s,d)=>s+d.total,0)/n),wk:(l.reduce((s,d)=>s+d.week,0)/n).toFixed(1),ina:l.filter(d=>d.last>=5).length}}).sort((a,b)=>b.wk-a.wk);
return `<div class="card" style="margin-bottom:14px"><h3>Mentor performance</h3><div class="sub" style="margin:-6px 0 4px">Click a mentor to filter the whole dashboard.</div><div class="tw"><table><thead><tr><th>Mentor</th><th>Mentees</th><th>Avg solved</th><th>Avg this week</th><th>Inactive</th></tr></thead><tbody>${rows.map(r=>`<tr class="r" data-m="${r.m}" style="${r.m===sel?'background:rgba(56,189,248,.14)':''}"><td><b>${r.m}</b></td><td>${r.n}</td><td>${r.avg}</td><td>${r.wk}</td><td class="${r.ina?'warn':'ok'}">${r.ina}</td></tr>`).join('')}</tbody></table></div></div>`}
function vOv(a){const wk=Array.from({length:8},(_,i)=>a.reduce((s,d)=>s+d.series[i],0)),pt=['lc','cf','cc','hr'].map(k=>a.reduce((s,d)=>s+d[k],0));
const top=[...a].sort((x,y)=>y.week-x.week).slice(0,5),at=a.filter(att).sort((x,y)=>y.last-x.last).slice(0,5);
return `<div class="grid">${[['Mentees',a.length],['Solved this week',a.reduce((s,d)=>s+d.week,0)],['Active (≤3 days)',a.filter(d=>d.last<=3).length],['Inactive (≥5 days)',a.filter(d=>d.last>=5).length]].map(([k,v])=>`<div class="card stat"><b>${v}</b><span class="sub">${k}</span></div>`).join('')}</div>
${mp()}<div class="grid2"><div class="card"><h3>Solved per week</h3>${bars(wk)}</div><div class="card"><h3>By platform</h3><div class="dn">${donut(pt)}<div>${legend(pt)}</div></div></div></div>
<div class="grid2"><div class="card"><h3>Top this week</h3>${top.map(row).join('')}</div><div class="card"><h3>Needs attention</h3>${at.length?at.map(row).join(''):'<div class="sub">Everyone’s on track.</div>'}</div></div>`}
function lbRows(){const l=scope().filter(d=>d.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>sortK==='name'||sortK==='mentor'?dir*a[sortK].localeCompare(b[sortK]):dir*(a[sortK]-b[sortK]));
return l.map((d,i)=>`<tr class="r" data-n="${esc(d.name)}"><td class="sub">${i+1}</td><td><b>${esc(d.name)}</b></td><td><span class="pill" data-m="${d.mentor}" data-tip="Filter by ${d.mentor}">${d.mentor}</span></td><td><b>${d.total}</b><div class="mb" data-tip="LC ${d.lc} · CF ${d.cf} · CC ${d.cc} · HR ${d.hr}">${[d.lc,d.cf,d.cc,d.hr].map((v,i)=>`<i style="width:${v/(d.total||1)*100}%;background:${COL[i]}"></i>`).join('')}</div></td><td>${d.week}</td><td><span class="pill ${pc(d)}">${lt(d)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="sub">No mentees found.</td></tr>'}
function vLb(){return `<div class="card"><input id="q" placeholder="Search mentee…" value="${esc(q)}"><div class="tw"><table><thead><tr><th>#</th><th data-k="name">Mentee</th><th data-k="mentor">Mentor ↕</th><th data-k="total">Total solved ↕</th><th data-k="week">This week ↕</th><th data-k="last">Last active ↕</th></tr></thead><tbody id="tb">${lbRows()}</tbody></table></div></div>`}
function vAt(a){const l=a.filter(att).sort((x,y)=>y.last-x.last);return `<div class="card"><h3>Needs attention · ${l.length}</h3><div class="sub" style="margin:-6px 0 8px">No activity for 5+ days, or fewer than 3 solved this week.</div>${l.map(row).join('')||'<div class="sub">Everyone’s on track.</div>'}</div>`}
function integ(a){const x=a.map(d=>({d,x:an(d)})).sort((p,q)=>q.x.score-p.x.score),c=l=>x.filter(o=>o.x.lvl===l).length;
return `<div class="card" style="margin-bottom:14px"><h3>Integrity check</h3><div class="sub">Flags unusually fast or high-volume solving so a mentor can follow up. These are indicators only, not proof. Talk to the mentee before drawing conclusions.</div><div class="chips" style="margin:14px 0 0;grid-template-columns:repeat(3,1fr)">${['High','Medium','Low'].map(l=>`<div class="chip"><b class="${lc(l)}">${c(l)}</b><span class="sub">${l} flag</span></div>`).join('')}</div></div><div class="card">${x.map(o=>{const t=o.x.rules.filter(r=>r[2]>0).map(r=>r[0]+': '+r[1]);return `<div class="li" data-n="${esc(o.d.name)}" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(o.d.name)}</b><span class="pill ${lc(o.x.lvl)}">${o.x.lvl} · ${o.x.score}/100</span></div><div class="sub" style="margin-top:4px">${t.length?t.join(' · '):'No unusual patterns.'}</div></div>`}).join('')}</div>`}

function render(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const a=scope();$('main').innerHTML=view==='ov'?vOv(a):view==='lb'?vLb():view==='at'?vAt(a):integ(a)}
function drawer(){const d=data.find(x=>x.name===cur),p=prof(d);$('dt').innerHTML=`<b>${esc(d.name)}</b><div class="sub">Mentor: ${d.mentor} · CF rating ${d.rating}</div>`;
$('dtabs').innerHTML=[['sum','Summary'],['plat','Platforms'],['ig','Integrity']].map(([k,t])=>`<button data-t="${k}" class="${k===dtab?'on':''}">${t}</button>`).join('');
$('db').innerHTML=dtab==='sum'?p.sum:dtab==='plat'?p.plat:sig(d)}
function openD(n){cur=n;dtab='sum';drawer();$('drawer').classList.add('open');$('scrim').classList.add('open');$('drawer').scrollTop=0}
function closeD(){$('drawer').classList.remove('open');$('scrim').classList.remove('open')}

$('seg').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}};
$('main').onclick=e=>{const mp=e.target.closest('[data-m]');if(mp){$('mentor').value=mp.dataset.m;render();return}const th=e.target.closest('th[data-k]');if(th){const k=th.dataset.k;dir=sortK===k?-dir:(k==='name'||k==='mentor'?1:-1);sortK=k;render();return}const r=e.target.closest('[data-n]');if(r)openD(r.dataset.n)};
$('main').oninput=e=>{if(e.target.id==='q'){q=e.target.value;$('tb').innerHTML=lbRows()}};
$('dtabs').onclick=e=>{const b=e.target.closest('button');if(b){dtab=b.dataset.t;drawer()}};
$('dx').onclick=closeD;$('scrim').onclick=closeD;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
$('mentor').onchange=render;
$('addBtn').onclick=()=>$('form').classList.toggle('show');
$('save').onclick=()=>{const n=$('fn').value.trim();if(!n)return;data.push({name:n,mentor:$('mentor').value==='All mentors'?'Aarav':$('mentor').value,lc:0,cf:0,cc:0,hr:0,total:0,rating:0,week:0,last:0,series:[0,0,0,0,0,0,0,0]});['fn','fl','fc','fk','fh'].forEach(i=>$(i).value='');$('form').classList.remove('show');render()};
const tip=$('tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.textContent=t.dataset.tip;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(e.clientX+12,innerWidth-w-8))+'px';tip.style.top=(e.clientY-h-12<4?e.clientY+16:e.clientY-h-12)+'px'}
['mouseover','mousemove','click'].forEach(ev=>document.addEventListener(ev,showTip));
document.addEventListener('scroll',()=>tip.style.display='none',true);
render();
</script>
</body>
</html>
